[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "total-agent"
version = "1.0.0"
description = "零依赖的多步骤任务总代理：DAG 编排、行为边界、崩溃恢复、人工确认、结构化结果"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Garvin" }]
keywords = ["orchestrator", "dag", "checkpoint", "resume", "human-in-the-loop"]
dependencies = []

[project.scripts]
total-agent = "total_agent.cli:main"

[tool.setuptools]
packages = ["total_agent"]
